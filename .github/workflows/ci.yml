name: ci
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # shellcheck ships on the runner image.
      - run: shellcheck scripts/*.sh
      - run: bash -n scripts/*.sh
