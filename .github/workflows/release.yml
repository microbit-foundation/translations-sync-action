name: release

# Consumers reference the floating major tag (v1). Publishing a release for
# vX.Y.Z moves vX to it.
on:
  release:
    types: [published]
jobs:
  major-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: |
          tag="${GITHUB_REF_NAME}"
          case "${tag}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Release tag '${tag}' is not vX.Y.Z" >&2; exit 1 ;;
          esac
          major="${tag%%.*}"
          git tag -f "${major}" "${tag}"
          git push -f origin "${major}"
